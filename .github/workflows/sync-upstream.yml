name: Check for new releases

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Perform a dry run without making external changes
        type: boolean
        required: false
        default: true

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        game: [poe1, poe2, le]
    env:
      GAME: ${{ matrix.game }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      GITHUB_TOKEN: ${{ github.token }}
      R2_ENDPOINT_URL: https://621480c42e70995622a2d0a86bb7751c.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      MISE_SOPS_STRICT: 'false'
      MISE_ENV: pob-cool
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
          path: ~/.npm

      - uses: jdx/mise-action@v3
      - run: mise run install

      - name: Sync and test new releases
        run: |
          args=(--game "$GAME" --output ".artifacts/$GAME.json")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          mise run upstream-sync:collect "${args[@]}"

      - name: Upload compatibility result
        uses: actions/upload-artifact@v7
        with:
          name: upstream-sync-${{ matrix.game }}
          path: .artifacts/${{ matrix.game }}.json
          retention-days: 1

  update-versions:
    runs-on: ubuntu-latest
    needs: check-release
    env:
      VERSION_FILE: version.json
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      R2_ENDPOINT_URL: https://621480c42e70995622a2d0a86bb7751c.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      MISE_SOPS_STRICT: 'false'
      MISE_ENV: pob-cool
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.TOKEN_APP_ID }}
          private-key: ${{ secrets.TOKEN_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: jdx/mise-action@v3

      - name: Download compatibility results
        uses: actions/download-artifact@v8
        with:
          pattern: upstream-sync-*
          path: .artifacts
          merge-multiple: true

      - name: Update version metadata
        run: |
          args=(--results-directory .artifacts)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          mise run upstream-sync:merge "${args[@]}"

      - name: Commit changes
        if: env.DRY_RUN != 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet -- "$VERSION_FILE"; then
            exit 0
          fi
          git config user.name "atty303-bot[bot]"
          git config user.email "atty303-bot[bot]@users.noreply.github.com"
          git add "$VERSION_FILE"
          git commit -m "Update version.json with tested upstream releases"
          git push
