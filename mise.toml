[tools]
deno = "2.9.3"
emsdk = "6.0.6"
cmake = "4.3.3"
ninja = "1.13.2"

hk = "1.54.1"
pkl = "0.31.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
sentry-cli = "3.6.2"

[settings]
lockfile = true

[tasks.install]
run = "deno ci"
sources = [
  "deno.json",
  "deno.lock",
  "packages/*/deno.json"
]
outputs = { auto = true }

[tasks.setup]
description = "Set up dependencies, submodules, and repository hooks"
run = """
git submodule update --init --recursive
hk install --mise
"""
depends = ["install"]

[tasks."test:driver"]
description = "Run focused driver behavior tests"
run = "deno task --filter pob-driver test"
depends = ["driver:build"]

[tasks."test:web"]
description = "Run focused web behavior tests"
run = "deno task --filter pob-web test"
depends = ["install"]

[tasks."test:upstream-sync"]
description = "Check and test the upstream sync tooling"
run = """
deno fmt --check deno.json tools/upstream-sync
deno lint tools/upstream-sync
deno check tools/upstream-sync/main.ts tools/upstream-sync/*_test.ts
deno test --allow-read --allow-write tools/upstream-sync
deno run tools/upstream-sync/main.ts --help >/dev/null
"""

[tasks."test:sentry-upload"]
description = "Check and test the Sentry debug information upload tooling"
run = """
deno fmt --check deno.json tools/sentry-upload
deno lint tools/sentry-upload
deno check tools/sentry-upload/main.ts tools/sentry-upload/main_test.ts
deno test --allow-read --allow-write tools/sentry-upload
"""

[tasks."test:driver:debuginfo"]
description = "Verify production Wasm debug information generation"
run = """
test -f packages/driver/dist/release/driver.wasm.debug.wasm
llvm-objdump -h packages/driver/dist/release/driver.wasm | grep -q 'build_id'
llvm-objdump -h packages/driver/dist/release/driver.wasm | grep -q 'external_debug_info'
if llvm-objdump -h packages/driver/dist/release/driver.wasm | grep -q '[.]debug_'; then
  echo 'release Wasm contains DWARF sections' >&2
  exit 1
fi
llvm-objdump -h packages/driver/dist/release/driver.wasm.debug.wasm | grep -q '[.]debug_info'
sentry-cli debug-files check packages/driver/dist/release/driver.wasm | grep -q 'Usable: yes'
sentry-cli debug-files check packages/driver/dist/release/driver.wasm.debug.wasm | grep -q 'Usable: yes'
"""
depends = ["driver:build"]

[tasks."upstream-sync:collect"]
description = "Discover, sync, and test new releases for one game"
usage = """
flag "--game <game>" {
  choices "poe1" "poe2" "le"
}
flag "--version-file <path>" { default "version.json" }
flag "--output <path>"
flag "--dry-run"
"""
run = """
set -- collect --game "${usage_game?}" --version-file "${usage_version_file?}" --output "${usage_output?}"
[ -n "$usage_dry_run" ] && set -- "$@" --dry-run
deno run --allow-env --allow-net=api.github.com --allow-read --allow-write --allow-run=mise \
  tools/upstream-sync/main.ts "$@"
"""

[tasks."upstream-sync:merge"]
description = "Merge matrix compatibility results into version metadata"
usage = """
flag "--version-file <path>" { default "version.json" }
flag "--results-directory <path>"
flag "--dry-run"
"""
run = """
set -- merge --version-file "${usage_version_file?}" --results-directory "${usage_results_directory?}"
[ -n "$usage_dry_run" ] && set -- "$@" --dry-run
deno run --allow-env --allow-read --allow-write --allow-run=mise tools/upstream-sync/main.ts "$@"
"""

[tasks."test:e2e:driver"]
description = "Run local driver runtime tests"
usage = """
flag "--game <game>" { choices "poe1" "poe2" "le" }
flag "--version <version>"
"""
run = """
if [ -z "$usage_game" ] && [ -n "$usage_version" ]; then
  echo "--version requires --game" >&2
  exit 2
fi
if [ -n "$usage_game" ]; then
  export RUN_GAME="$usage_game"
  if [ -n "$usage_version" ]; then
    export RUN_VERSION="$usage_version"
  else
    unset RUN_VERSION
  fi
else
  unset RUN_GAME RUN_VERSION
fi
deno run -A tools/pack-e2e-assets.ts driver
deno task --filter pob-driver test:e2e
"""
depends = ["driver:build"]

[tasks."test:e2e:web"]
description = "Run the local web-to-driver critical-path test"
run = """
deno run -A tools/pack-e2e-assets.ts web
deno task --filter pob-web test:e2e
"""
depends = ["driver:build"]

[tasks."test:sentry:live"]
description = "Verify Chromium and Firefox Wasm symbolication through Sentry"
run = """
test -n "${SENTRY_LIVE_AUTH_TOKEN:-}" || { echo 'SENTRY_LIVE_AUTH_TOKEN is required' >&2; exit 1; }
test -n "${SENTRY_LIVE_DSN:-}" || { echo 'SENTRY_LIVE_DSN is required' >&2; exit 1; }
SENTRY_AUTH_TOKEN="$SENTRY_LIVE_AUTH_TOKEN" sentry-cli debug-files upload --org "${SENTRY_LIVE_ORG:-atty303}" --project "${SENTRY_LIVE_PROJECT:-pob-web}" --type wasm --include-sources --wait packages/driver/dist/release/driver.wasm.debug.wasm
deno run -A tools/pack-e2e-assets.ts web
SENTRY_LIVE_TEST=1 deno task --filter pob-web test:e2e sentry-wasm.spec.mts
"""
depends = ["driver:build"]

[tasks."benchmark:setup"]
description = "Install the Chromium and Firefox browsers used for driver benchmarks"
run = "deno task playwright install chromium firefox"
depends = ["install"]

[tasks."benchmark:driver"]
description = "Benchmark a release driver build in Chromium and Firefox"
run = '''
export RUN_GAME=poe1
export RUN_VERSION=v2.66.2
export RUN_BUILD=release
unset POB_COOL_ASSET
deno run -A tools/pack-e2e-assets.ts driver
deno task --filter pob-driver build:release
deno task --filter pob-driver test:performance
'''
depends = ["benchmark:setup"]

[tasks.check]
description = "Run generated-file, static, and driver checks"
usage = 'arg "[files]" var=#true'
run = """
deno task --filter pob-web typegen
if [ -n "$usage_files" ]; then eval "set -- $usage_files"; else set -- --all; fi; hk check "$@"
"""
depends = ["install", "test:driver", "test:web", "test:driver:debuginfo", "test:sentry-upload", "test:upstream-sync", "driver:build"]

[tasks.fix]
description = "Fix formatting and lint issues"
usage = 'arg "[files]" var=#true'
run = 'if [ -n "$usage_files" ]; then eval "set -- $usage_files"; else set -- --all; fi; hk fix "$@"'
depends = ["install"]

[tasks."check:full"]
description = "Run all checks and production builds"
run = """
mise run --skip-deps web:build
if find packages/web/build/client -name '*.debug.wasm' -print -quit | grep -q .; then
  echo 'web build contains Wasm debug sidecars' >&2
  exit 1
fi
"""
depends = ["check", "driver:build"]

[tasks."playwright:mcp"]
description = "Start Playwright MCP with coordinate-based Vision Mode"
depends = ["install"]
run = """
chromium_path="$(deno eval 'import { chromium } from "@playwright/test"; Deno.stdout.write(new TextEncoder().encode(chromium.executablePath()))')"
if [ ! -x "$chromium_path" ]; then
  echo "Chromium is not installed; run 'mise run visual:setup' first" >&2
  exit 1
fi

args=(--caps=vision --isolated --viewport-size=1440x900 --executable-path="$chromium_path")
[ "${PLAYWRIGHT_MCP_HEADED:-}" = "1" ] || args+=(--headless)
exec deno task playwright-mcp "${args[@]}"
"""

[tasks."visual:setup"]
description = "Install the Chromium browser used for visual verification"
depends = ["install"]
run = "deno task playwright install chromium"

[tasks."visual:dev"]
description = "Start the driver UI for interactive visual verification"
usage = """
flag "--game <game>" {
  help "Game to run"
  choices "poe1" "poe2" "le"
  default "poe2"
}
flag "--version <version>" help="Game version to run; defaults to the current head"
flag "--build <build>" {
  help "Build type to run"
  choices "release" "debug"
  default "release"
}
flag "--pob-cool-asset" help="Use https://asset.pob.cool assets instead of local packed assets"
"""
run = """
export RUN_GAME="${usage_game?}"
export RUN_VERSION="${usage_version:-}"
export RUN_BUILD="${usage_build?}"
if [ -n "$usage_pob_cool_asset" ]; then
  export POB_COOL_ASSET=true
else
  unset POB_COOL_ASSET
fi

if [ -z "$RUN_VERSION" ]; then
  RUN_VERSION="$(deno eval --allow-env=RUN_GAME 'import versions from "./version.json" with { type: "json" }; Deno.stdout.write(new TextEncoder().encode(versions[Deno.env.get("RUN_GAME")].head))')"
  export RUN_VERSION
fi

if [ -z "${POB_COOL_ASSET:-}" ]; then
  asset_path="packages/packer/r2/games/$RUN_GAME/versions/$RUN_VERSION/root.zip"
  if [ ! -f "$asset_path" ]; then
    echo "Local assets are missing. Run: mise run pack --game $RUN_GAME --tag $RUN_VERSION" >&2
    exit 1
  fi
fi

deno task --filter pob-driver dev --host 127.0.0.1
"""
depends = ["driver:build"]

[tasks.pack]
description = "Pack the distribution from upstream repository"
usage = """
flag "--game <game>" { choices "poe1" "poe2" "le" }
flag "--tag <tag>"
"""
run = """
deno task --filter pob-packer pack "${usage_tag?}" "${usage_game?}" clone
"""
depends = ["install"]

[tasks."driver:build"]
description = "Build the driver package"
run = "deno task --filter pob-driver build"
sources = [
  "mise.toml",
  "mise.lock",
  "packages/driver/*.lua",
  "packages/driver/CMakeLists.txt",
  "packages/driver/*.cmake",
  "packages/driver/*.json",
  "packages/driver/src/c/**/*",
  "packages/driver/test/c/**/*",
  "vendor/lua/**/*",
  "vendor/luautf8/**/*",
]
outputs = [
  "packages/driver/build/**/*",
  "packages/driver/dist/**/*",
]
depends = ["install"]

[tasks."driver:dev"]
description = "Start dev server for driver"
usage = """
flag "--game <game>" {
  help "Game to run"
  choices "poe1" "poe2" "le"
}
flag "--version <version>" help="Game version to run"
flag "--build <build>" {
  help "Build type to run"
  choices "release" "debug"
  default "release"
}
flag "--pob-cool-asset" help="Use https://asset.pob.cool asset instead of local packed assets"
"""
run = """
export RUN_GAME="${usage_game?}"
export RUN_VERSION="${usage_version?}"
export RUN_BUILD="${usage_build?}"
[ -n "$usage_pob_cool_asset" ] && export POB_COOL_ASSET=true

deno task --filter pob-driver dev --port 5173 --strictPort
"""
depends = ["driver:build"]

[tasks."web:build"]
description = "Build the web package"
run = "deno task --filter pob-web build"
depends = ["driver:build"]

[tasks."sentry:upload"]
description = "Upload the current production source maps and Wasm debug information to Sentry"
run = "deno run --allow-env=SENTRY_AUTH_TOKEN,SENTRY_RELEASE --allow-read --allow-run=sentry-cli tools/sentry-upload/main.ts"

[tasks."web:deploy"]
description = "Build, upload source maps, and deploy the web package"
run = """
export DEPLOYMENT=cloudflare
deno task --filter pob-web build
mise run sentry:upload
deno task --filter pob-web deploy:pages
"""
depends = ["install", "driver:build"]

[tasks."web:dev"]
description = "Start dev server for web"
usage = """
flag "--pob-cool-asset" help="Use https://asset.pob.cool asset instead of local packed assets"
"""
run = """
[ -n "$usage_pob_cool_asset" ] && export POB_COOL_ASSET=true
deno task --filter pob-web dev
"""
depends = ["driver:build"]
